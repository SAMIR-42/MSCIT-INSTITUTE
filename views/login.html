<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MSCIT — Login</title>
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-topbar">
      <a href="/" class="auth-brand">← MSCIT Institute</a>
      <a href="/signup" class="auth-back">Create account</a>
    </div>

    <div class="auth-wrap">
      <div class="container auth-container">
        <h2>Institute Login</h2>
        <p class="auth-subtitle">Sign in to access your dashboard</p>
        <form id="loginForm">
          <input type="text" name="username" placeholder="Username" required autocomplete="username" />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          />
          <button type="submit">Login</button>
        </form>
        <p class="auth-link">New institute? <a href="/signup">Register here</a></p>
        <div id="msg" class="msg"></div>
      </div>
    </div>

    <script src="/login.js"></script>
  </body>
</html>
