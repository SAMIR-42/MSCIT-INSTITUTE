<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSCIT Institute — Sign Up</title>
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-topbar">
      <a href="/" class="auth-brand">← MSCIT Institute</a>
      <a href="/login" class="auth-back">Already registered?</a>
    </div>

    <div class="auth-wrap">
      <div class="container auth-container signup-box">
        <h2>Institute Registration</h2>
        <p class="auth-subtitle">Create your admin account to manage students</p>
        <form id="signupForm">
          <input
            type="text"
            name="institute_name"
            placeholder="Institute Name"
            required
          />
          <select name="institute_type" required>
            <option value="">Select Institute Type</option>
            <option value="Private">Private</option>
            <option value="Government">Government</option>
            <option value="NGO">NGO</option>
          </select>
          <input
            type="text"
            name="registration_number"
            placeholder="Registration Number"
            required
          />
          <textarea name="address" placeholder="Full Address" required></textarea>
          <input
            type="text"
            name="admin_name"
            placeholder="Admin Full Name"
            required
          />
          <input
            type="email"
            name="admin_email"
            placeholder="Admin Email"
            required
          />
          <input
            type="text"
            name="admin_mobile"
            placeholder="Admin Mobile (10 digits)"
            required
            pattern="[0-9]{10}"
            title="Enter a valid 10-digit mobile number"
          />
          <input type="text" name="username" placeholder="Choose Username" required />
          <input
            type="password"
            name="password"
            placeholder="Password (min 6 characters)"
            required
            minlength="6"
          />
          <button type="submit">Create Account</button>
        </form>

        <p class="auth-link">Have an account? <a href="/login">Login here</a></p>

        <div id="otpDiv" style="display: none">
          <h3>Verify your email</h3>
          <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" />
          <button type="button" id="verifyOtpBtn">Verify OTP</button>
        </div>

        <div id="message"></div>
      </div>
    </div>

    <script src="/signup.js"></script>
  </body>
</html>
